global
  log stdout format raw local0
  maxconn 500

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 2m
  timeout server 2m

frontend redis_tls
  bind *:6380 ssl crt /etc/haproxy/tls/redis.pem
  default_backend redis_internal

backend redis_internal
  server redis redis:6379 check
